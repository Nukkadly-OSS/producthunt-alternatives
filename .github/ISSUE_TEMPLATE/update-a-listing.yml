name: Update a listing
description: Fix a URL, access, follow type, DR, or description.
title: "Update: "
labels:
  - listing-update
body:
  - type: input
    id: name
    attributes:
      label: Current name on the list
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Current URL
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: Quote the old value and the new value.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: How you checked
      description: Page you opened, date, and what you saw.
    validations:
      required: true
